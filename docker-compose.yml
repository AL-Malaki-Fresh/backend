services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: almalaki-backend
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: development
      PORT: 5001
      DATABASE_URL: postgresql://postgres:password@postgres:5432/almalaki
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-your-super-secret-access-key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-super-secret-refresh-key}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_FRONTEND_URL: http://localhost:5173
      TAP_SECRET_KEY: ${TAP_SECRET_KEY}
      TAP_MERCHANT_ID: ${TAP_MERCHANT_ID}
      TAP_RETURN_URL: ${TAP_RETURN_URL}
      TAP_CURRENCY: ${TAP_CURRENCY:-QAR}
      TAP_WEBHOOK_URL: ${TAP_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - almalaki-network
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: almalaki-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: almalaki
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - almalaki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d almalaki"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: almalaki-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@almalaki.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - almalaki-network
    restart: unless-stopped

networks:
  almalaki-network:
    driver: bridge

volumes:
  postgres-data: