services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: almalaki-backend
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 5001
      # Local-dev-only fallbacks so `docker compose up` works with no .env
      # file at all. These are NOT used on Render (which doesn't read this
      # file) — set real values in Render's own env var settings before
      # deploying. env.js still hard-requires these either way, so a
      # deployment that forgets to set them will still refuse to boot.
      # This default DATABASE_URL matches the postgres service's own
      # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB defaults below — if you
      # override one of those in .env, update this to match.
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:dev-only-postgres-password@postgres:5432/almalaki}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-insecure-access-secret-change-before-deploy}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-insecure-refresh-secret-change-before-deploy}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:5173}
      TAP_SECRET_KEY: ${TAP_SECRET_KEY}
      TAP_MERCHANT_ID: ${TAP_MERCHANT_ID}
      TAP_RETURN_URL: ${TAP_RETURN_URL}
      TAP_CURRENCY: ${TAP_CURRENCY:-QAR}
      TAP_WEBHOOK_URL: ${TAP_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - almalaki-network
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./prisma.config.ts:/app/prisma.config.ts
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: almalaki-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Local-dev-only default — keep in sync with the backend service's
      # DATABASE_URL default above if you change this.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-almalaki}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - almalaki-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d almalaki"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: almalaki-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@almalaki.com}
      # Local-dev-only default.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-dev-only-pgadmin-password}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - almalaki-network
    restart: unless-stopped

networks:
  almalaki-network:
    driver: bridge

volumes:
  postgres-data: